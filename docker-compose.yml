services:
  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    build:
      context: ./LightRAG
      dockerfile: Dockerfile
    ports:
      - "${LIGHTRAG_HOST:-0.0.0.0}:${LIGHTRAG_PORT:-9621}:9621"
    volumes:
      - ./LightRAG/data/rag_storage:/app/data/rag_storage
      - ./LightRAG/data/inputs:/app/data/inputs
      - ./LightRAG/data/prompts:/app/data/prompts
      - ./LightRAG/.env:/app/.env
      # NOTE: Do NOT mount the entire ./LightRAG/lightrag directory here —
      # the Docker image builds the WebUI assets into /app/lightrag/api/webui
      # during the frontend-builder stage, and a broad bind-mount would shadow
      # (hide) those built assets with the bare source tree from the host.
      # If you need live Python code reloading, mount only the specific files
      # or subdirectories you are actively editing, e.g.:
      #   - ./LightRAG/lightrag/api/lightrag_server.py:/app/lightrag/api/lightrag_server.py

    command: python -m lightrag.api.lightrag_server
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 10
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WORKING_DIR: "/app/data/rag_storage"
      INPUT_DIR: "/app/data/inputs"
      PROMPT_DIR: "/app/data/prompts"
      HOST: "0.0.0.0"
      PORT: "9621"
      # Points to the docling-service container inside the docker network
      DOCLING_ENDPOINT: "http://docling-service:8080"
    depends_on:
      - docling-service

  docling-service:
    build:
      context: ./docling_service
      dockerfile: Dockerfile
    ports:
      - "${DOCLING_HOST:-0.0.0.0}:${DOCLING_PORT:-8080}:8080"
    volumes:
      - ./docling_service/.env:/app/.env
      - docling_cache:/app/data/huggingface
    environment:
      HF_HOME: "/app/data/huggingface"
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 10

volumes:
  docling_cache:
