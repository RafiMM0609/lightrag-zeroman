services:
  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    build:
      context: ./LightRAG
      dockerfile: Dockerfile
      tags:
        - ghcr.io/hkuds/lightrag:latest
    ports:
      - "${LIGHTRAG_HOST:-0.0.0.0}:${LIGHTRAG_PORT:-9621}:9621"
    volumes:
      - ./LightRAG/data/rag_storage:/app/data/rag_storage
      - ./LightRAG/data/inputs:/app/data/inputs
      - ./LightRAG/data/prompts:/app/data/prompts
      - ./LightRAG/.env:/app/.env
      - ./LightRAG/lightrag:/app/lightrag
    command: uvicorn lightrag.api.lightrag_server:get_application --factory --reload --host 0.0.0.0 --port 9621
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 10
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WORKING_DIR: "/app/data/rag_storage"
      INPUT_DIR: "/app/data/inputs"
      PROMPT_DIR: "/app/data/prompts"
      HOST: "0.0.0.0"
      PORT: "9621"
      # Points to the docling-service container inside the docker network
      DOCLING_ENDPOINT: "http://docling-service:8080"
    depends_on:
      - docling-service

  docling-service:
    build:
      context: ./docling_service
      dockerfile: Dockerfile
    ports:
      - "${DOCLING_HOST:-0.0.0.0}:${DOCLING_PORT:-8080}:8080"
    volumes:
      - ./docling_service/.env:/app/.env
      - docling_cache:/app/data/huggingface
    environment:
      HF_HOME: "/app/data/huggingface"
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 10

volumes:
  docling_cache:
